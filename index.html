<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f8a4e">
<title>말랑블록</title>
<link rel="icon" href="garden/icon-192.png">
<style>
  :root{--ink:#1d3b2c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);
    background:linear-gradient(#e9f7ef,#d6efe1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
  h1{font-size:26px;margin:0 0 6px}
  p{margin:0 0 22px;color:#4c6b5b;font-size:15px;text-align:center;line-height:1.5}
  a.card{display:flex;align-items:center;gap:16px;width:100%;max-width:360px;text-decoration:none;color:#fff;
    border-radius:22px;padding:16px 18px;margin:8px 0;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  a.card img{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  a.card b{display:block;font-size:20px}
  a.card span{font-size:14px;opacity:.85}
  .g{background:linear-gradient(135deg,#45c27c,#1f8a4e)}
  .s{background:linear-gradient(135deg,#4a2c8f,#150f38)}
  small{margin-top:20px;color:#5d7a6b;font-size:13px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <h1>말랑블록</h1>
  <p>하고 싶은 게임을 골라요</p>
  <a class="card g" href="garden/"><img src="garden/icon-192.png" alt=""><div><b>가든</b><span>초록 정원 블록 놀이</span></div></a>
  <a class="card s" href="space/"><img src="space/icon-192.png" alt=""><div><b>우주</b><span>별빛 우주 블록 놀이</span></div></a>
  <small>게임을 연 뒤 Chrome 메뉴(⋮) → '앱 설치' 또는 '홈 화면에 추가'<br>두 게임의 기록은 서로 이어집니다</small>
</body>
</html>
